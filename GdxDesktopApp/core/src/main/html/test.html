<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMetrics Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: transparent;
        }

        /* Sidebar Styles */
        #sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 320px;
            height: 100vh;
            background: rgba(30, 30, 40, 0.95);
            color: #ffffff;
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        #sidebar.hidden {
            transform: translateX(-320px);
        }

        /* Sidebar Header */
        .sidebar-header {
            padding: 20px;
            background: rgba(20, 20, 30, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Sidebar Content */
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar-section {
            margin-bottom: 25px;
        }

        .sidebar-section h2 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
        }

        /* Risk Type Buttons */
        .risk-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .risk-button {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            text-align: left;
        }

        .risk-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .risk-button.active {
            background: rgba(66, 133, 244, 0.3);
            border-color: rgba(66, 133, 244, 0.6);
        }

        /* Info Panel */
        .info-panel {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-panel p {
            font-size: 13px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Toggle Button - Arrow on sidebar edge */
        #toggleButton {
            position: fixed;
            left: 320px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 80px;
            background: rgba(30, 30, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-left: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            z-index: 1001;
            transition: left 0.3s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        #toggleButton:hover {
            background: rgba(40, 40, 50, 0.95);
        }

        #toggleButton.sidebar-hidden {
            left: 0;
        }

        /* Arrow Icon */
        .arrow {
            font-size: 20px;
            color: #ffffff;
            transition: transform 0.3s ease;
        }

        #toggleButton.sidebar-hidden .arrow {
            transform: rotate(180deg);
        }

        /* Remove hamburger styles */
        .hamburger {
            display: none;
        }

        /* Scrollbar Styling */
        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .sidebar-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <!-- Toggle Button -->
    <div id="toggleButton" class="sidebar-hidden">
        <div class="arrow">➤</div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="hidden">
        <div class="sidebar-header">
            <h1>GeoMetrics</h1>
            <p>Risk Analysis Dashboard</p>
        </div>

        <div class="sidebar-content">
            <div class="sidebar-section">
                <h2>Risk Types</h2>
                <div class="risk-buttons">
                    <button class="risk-button" data-risk="earthquake">
                        🌍 Earthquake Risk
                    </button>
                    <button class="risk-button" data-risk="flood">
                        💧 Flood Risk
                    </button>
                    <button class="risk-button" data-risk="landslide">
                        🏔️ Landslide Risk
                    </button>
                    <button class="risk-button" data-risk="disaster-reports">
                        📍 Disaster Reports
                    </button>
                    <button class="risk-button" data-risk="none">
                        📐 Land lots
                    </button>
                </div>
            </div>

            <div class="sidebar-section">
                <h2 id="infoTitle">Plot Information</h2>
                <div class="info-panel">
                    <p id="plotInfo">Click on a plot on the map to view its data.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sidebar state - start closed
        let sidebarOpen = false;

        // Get elements
        const sidebar = document.getElementById('sidebar');
        const toggleButton = document.getElementById('toggleButton');
        const riskButtons = document.querySelectorAll('.risk-button[data-risk]');
        const plotInfo = document.getElementById('plotInfo');
        const infoTitle = document.getElementById('infoTitle');

        // Toggle sidebar function
        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;

            if (sidebarOpen) {
                sidebar.classList.remove('hidden');
                toggleButton.classList.remove('sidebar-hidden');
            } else {
                sidebar.classList.add('hidden');
                toggleButton.classList.add('sidebar-hidden');
            }

            // Notify Java backend about sidebar state
            sendMessageToJava('sidebarToggle', { open: sidebarOpen });
        }

        // Toggle button click handler
        toggleButton.addEventListener('click', toggleSidebar);

        // Risk button click handlers
        riskButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Remove active class from all risk buttons only
                riskButtons.forEach(btn => btn.classList.remove('active'));

                // Add active class to clicked button
                button.classList.add('active');

                // Get risk type
                const riskType = button.getAttribute('data-risk');

                // Notify Java backend about risk type change
                sendMessageToJava('riskTypeChange', { riskType: riskType });
            });
        });

        // Function to send messages to Java backend
        function sendMessageToJava(messageType, data) {
            if (window.cefQuery) {
                window.cefQuery({
                    request: JSON.stringify({
                        type: messageType,
                        data: data
                    }),
                    persistent: false,
                    onSuccess: function(response) {
                        console.log('Message sent successfully:', response);
                    },
                    onFailure: function(error_code, error_message) {
                        console.error('Failed to send message:', error_message);
                    }
                });
            }
        }

        // Function to update plot information (called from Java)
        function updatePlotInfo(plotData) {
            if (plotData && plotData.id) {
                const area = plotData.area && plotData.area !== 'N/A' ? `${plotData.area} m²` : 'N/A';
                plotInfo.innerHTML = `
                    <strong>Plot Number:</strong> ${plotData.plotNumber || 'N/A'}<br>
                    <strong>Plot ID:</strong> ${plotData.id || 'N/A'}<br>
                    <strong>Area:</strong> ${area}<br>
                    <strong>Cadastral Area ID:</strong> ${plotData.cadastralArea || 'N/A'}
                `;
                infoTitle.innerText = 'Plot Information';
            } else {
                plotInfo.innerHTML = 'Click on a plot on the map to view its data.';
                infoTitle.innerText = 'Plot Information';
            }
        }

        // Function to update disaster information (called from Java)
        function updateDisasterInfo(disasterData) {
            if (disasterData && disasterData.isDisaster) {
                // Get emoji based on disaster type
                let emoji = '⚠️';
                if (disasterData.type === 'Flood') emoji = '💧';
                else if (disasterData.type === 'Landslide') emoji = '🏔️';
                else if (disasterData.type === 'Earthquake') emoji = '🌍';

                // Get severity label with color
                let severityLabel = '';
                let severityColor = '';
                if (disasterData.severity === 1) {
                    severityLabel = 'Low';
                    severityColor = '#4CAF50';
                } else if (disasterData.severity === 2) {
                    severityLabel = 'Medium';
                    severityColor = '#FF9800';
                } else {
                    severityLabel = 'High';
                    severityColor = '#F44336';
                }

                plotInfo.innerHTML = `
                    <div style="text-align: center; margin-bottom: 12px;">
                        <span style="font-size: 40px;">${emoji}</span>
                    </div>
                    <strong>Type:</strong> ${disasterData.type}<br>
                    <strong>Severity:</strong> <span style="color: ${severityColor}; font-weight: bold;">${disasterData.severity}/3 (${severityLabel})</span><br>
                    <div style="margin-top: 15px; padding: 10px; background: rgba(244, 67, 54, 0.1); border-left: 3px solid #F44336; border-radius: 4px;">
                        <strong style="color: #F44336;">⚠ Disaster Alert</strong><br>
                    </div>
                `;
                infoTitle.innerText = 'Disaster Report';
            } else {
                plotInfo.innerHTML = 'Click on a disaster marker to view its details.';
                infoTitle.innerText = 'Plot Information';
            }
        }

        // Function to show sidebar (can be called from Java)
        function showSidebar() {
            if (!sidebarOpen) {
                toggleSidebar();
            }
        }

        // Function to hide sidebar (can be called from Java)
        function hideSidebar() {
            if (sidebarOpen) {
                toggleSidebar();
            }
        }

        // Initialize
        console.log('GeoMetrics UI initialized');
    </script>
</body>
</html>
